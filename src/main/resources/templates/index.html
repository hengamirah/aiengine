<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Name Verification</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2em; }
        .result { margin-top: 1em; padding: 1em; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>Name Verification</h1>
    <form id="verifyForm">
        <label>First Name: <input type="text" name="firstname" required></label><br><br>
        <label>Last Name: <input type="text" name="lastname" required></label><br><br>
        <label>Date of Birth: <input type="date" name="dob" required></label><br><br>
        <button type="submit">Verify</button>
    </form>
    <div id="result" class="result" style="display:none;"></div>
    <script>
        // helper to avoid injecting raw HTML
        function escapeHtml(unsafe) {
            return String(unsafe)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        document.getElementById('verifyForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            try {
                const form = e.target;
                const data = {
                    firstname: form.firstname.value.trim(),
                    lastname: form.lastname.value.trim(),
                    dob: form.dob.value
                };
                
                const res = await fetch('/api/verify-name', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await res.json();
                const resultDiv = document.getElementById('result');
                resultDiv.style.display = 'block';
                
                const isError = result.decision === 'ERROR';
                resultDiv.style.backgroundColor = isError ? '#ffebee' : '#f5f5f5';
                
                const reasons = result.reasons ? result.reasons.map(r => escapeHtml(r)).join('<br>') : 'No details available';
                
                const notes = result.notes ? '<br><b>Additional Info:</b><br>' +
                    Object.entries(result.notes)
                        .filter(([key]) => key !== 'error')
                        .map(([key, value]) => {
                            let display;
                            if (value === null || value === undefined) {
                                display = escapeHtml(String(value));
                            } else if (typeof value === 'object') {
                                // pretty-print objects
                                display = '<pre style="display:inline">' + escapeHtml(JSON.stringify(value, null, 2)) + '</pre>';
                            } else {
                                display = escapeHtml(String(value));
                            }
                            return escapeHtml(key) + ': ' + display;
                        })
                        .join('<br>') : '';
                
                resultDiv.innerHTML = `
                    <b>Status:</b> ${escapeHtml(result.decision)}<br>
                    <b>Reasons:</b><br>${reasons}
                    ${notes}
                `;
            } catch (error) {
                const resultDiv = document.getElementById('result');
                resultDiv.style.display = 'block';
                resultDiv.style.backgroundColor = '#ffebee';
                resultDiv.innerHTML = '<b>Error:</b><br>Failed to process request. Please try again.';
            }
        });
    </script>
</body>
</html>
