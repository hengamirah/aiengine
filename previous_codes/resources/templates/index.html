<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID Verification System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>
        .result-card { margin-top: 20px; }
        .detection-box { border: 2px solid #28a745; padding: 10px; margin: 10px 0; }
        .decision-accept { background-color: #d4edda; border-color: #c3e6cb; }
        .decision-review { background-color: #fff3cd; border-color: #ffeaa7; }
        .decision-reject { background-color: #f8d7da; border-color: #f5c6cb; }
        .preview img { max-width: 200px; max-height: 200px; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center mb-4">🆔 ID Verification System</h1>
        
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Personal Information</h5>
                <form id="verification-form" enctype="multipart/form-data">
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label for="first_name" class="form-label">First Name*</label>
                            <input type="text" class="form-control" id="first_name" name="first_name" required>
                        </div>
                        <div class="col-md-4">
                            <label for="last_name" class="form-label">Last Name*</label>
                            <input type="text" class="form-control" id="last_name" name="last_name" required>
                        </div>
                        <div class="col-md-4">
                            <label for="dob" class="form-label">Date of Birth*</label>
                            <input type="date" class="form-control" id="dob" name="dob" required>
                        </div>
                    </div>
                    
                    <h5 class="card-title mt-4">Document Upload</h5>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="id_front" class="form-label">ID Card (Front)</label>
                            <input type="file" class="form-control" id="id_front" name="id_front" accept="image/*,application/pdf">
                            <div class="preview mt-2" id="id_front_preview"></div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="id_back" class="form-label">ID Card (Back)</label>
                            <input type="file" class="form-control" id="id_back" name="id_back" accept="image/*,application/pdf">
                            <div class="preview mt-2" id="id_back_preview"></div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="photo" class="form-label">Person Photo</label>
                            <input type="file" class="form-control" id="photo" name="photo" accept="image/*">
                            <div class="preview mt-2" id="photo_preview"></div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="signature" class="form-label">Signature</label>
                            <input type="file" class="form-control" id="signature" name="signature" accept="image/*">
                            <div class="preview mt-2" id="signature_preview"></div>
                        </div>
                    </div>
                    
                    <div class="text-center mt-3">
                        <button type="submit" class="btn btn-primary btn-lg" id="submit-btn">
                            <i class="fas fa-shield-alt"></i> Verify Identity
                        </button>
                    </div>
                </form>
            </div>
        </div>
        
        <!-- Loading spinner -->
        <div id="loading" class="text-center d-none">
            <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                <span class="visually-hidden">Loading...</span>
        
            </div>
        </div>
        <!-- Results section -->
        <div id="results-section" class="d-none">
            <h2 class="mt-4 mb-3">Verification Results</h2>
            
            <!-- Name Verification Results -->
            <div class="card mb-4">
                <div class="card-header">
                    <h5 class="mb-0">Name Verification Results</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                    <!-- Logic Check Results -->
                    <div class="col-md-4">
                        <div class="card h-100" id="logic-check-results">
                        <!-- Logic check results will be displayed here -->
                        </div>
                    </div>

                    <!-- AI Check Results -->
                    <div class="col-md-4">
                        <div class="card h-100" id="ai-check-results">
                        <!-- AI check results will be displayed here -->
                        </div>
                    </div>

                    <!-- Final Decision -->
                    <div class="col-md-4">
                        <div class="card h-100" id="final-decision">
                        <!-- Final decision will be displayed here -->
                        </div>
                    </div>
                    </div>
                </div>
                </div>

                <!-- Detection Images -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">📄 Detection Results</h5>
                    </div>
                    <div class="card-body">
                        <div class="row" id="file-results">
                            <!-- Detection results will be displayed here -->
                        </div>
                    </div>
                </div>
                
                <!-- ID Elements (Crops) -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">🔍 ID Elements</h5>
                    </div>
                    <div class="card-body">
                        <div class="row" id="crop-results">
                            <!-- Cropped elements will be displayed here -->
                        </div>
                    </div>
                </div>
                
                <!-- Face Comparison -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">👤 Face Verification</h5>
                    </div>
                    <div class="card-body">
                        <div id="face-comparison-result">
                            <!-- Face comparison results will be displayed here -->
                        </div>
                    </div>
                </div>
                

                <div id="id-detections" class="mt-4"></div>
            </div>
        </div>
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/js/script.js}"></script>

        <script>
            // JavaScript to handle image loading with fallback
            document.querySelectorAll('.detection-result').forEach(img => {
                img.addEventListener('error', function() {
                    console.error('❌ Failed to load image:', this.src); 
                    const fallbackUrl = this.dataset.fallback;
                    console.log('🔄 Trying fallback URL:', fallbackUrl);
                    if (this.src !== fallbackUrl) {
                        this.src = fallbackUrl;
                    } else {
                        this.style.display = 'none';
                        this.nextElementSibling.style.display = 'block';
                    }
                });
            });
        </script>
    </body>
    </html>
