server.port=8080
spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=16MB
spring.web.resources.static-locations=classpath:/static/,file:./static/
spring.resources.add-mappings=true
# Model paths
onnx.model.path=model/
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
# Image cleanup settings
image.cleanup.enabled=true
image.cleanup.delay.minutes=5
image.cleanup.check.interval.seconds=60
# Log level for cleanup service
logging.level.com.example.ImageCleanupService=INFO
logging.level.com.example.PythonProcessService=INFO
logging.level.root=INFO

# Only show important logs
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
# JEP configuration (optional)
jep.enabled=true

# Oracle Database Configuration
db.URL=jdbc:oracle:thin:@20.247.177.55
db.port=1521
db.schema=ISLDB
db.USER=ISL_PRODUCT
db.PASS=


python.base_path=E:/05_MT/mt-ai-python/src/main/java/com/example/
# Application settings
app.database.enabled=true

# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.Oracle12cDialect

# Database pool settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# Application settings
app.database.enabled=true
cleanup.enabled=true
